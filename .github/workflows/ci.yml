name: Build, test and deploy

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          pull: true
          tags: app-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image
        run: docker save app-test | gzip > app-test.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: app-test-image
          path: app-test.tar.gz
          retention-days: 1
          compression-level: 0   # already gzipped

  deploy:
    needs: [build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
      - run: curl -fsS -X POST "${{ secrets.DOKPLOY_DEPLOY_HOOK }}"
