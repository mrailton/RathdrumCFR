<!DOCTYPE html>
<html lang="en" data-theme="rathdrum">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Rathdrum CFR{% endblock %}</title>
  <link rel="stylesheet" href="https://fonts.bunny.net/css?family=instrument-sans:400,500,600,700">
  <link rel="stylesheet" href="/static/assets/app.css">
  <script type="module" src="/static/assets/app.js"></script>
</head>
<body class="min-h-screen bg-base-200">
  <div class="navbar bg-primary text-primary-content shadow-md">
    <div class="flex-1"><a href="/" class="btn btn-ghost text-lg font-semibold text-primary-content">Rathdrum CFR</a></div>
    <div class="flex-none gap-1">
      <a href="/contact" class="btn btn-ghost btn-sm text-primary-content">Contact</a>
      <a href="/admin/login" class="btn btn-ghost btn-sm text-primary-content">Login</a>
    </div>
  </div>
  <main class="container mx-auto max-w-5xl p-4 sm:p-6">
    {% if success %}<div class="alert alert-success mb-4 shadow-sm"><span>{{ success }}</span></div>{% endif %}
    {% if error %}<div class="alert alert-error mb-4 shadow-sm"><span>{{ error }}</span></div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
