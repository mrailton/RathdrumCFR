{# Optional: title (required), subtitle, action_html (safe HTML string) #}
<div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between mb-6">
  <div>
    <h1 class="text-2xl font-bold text-base-content">{{ title }}</h1>
    {% if subtitle %}<p class="mt-1 text-sm text-base-content/70">{{ subtitle }}</p>{% endif %}
  </div>
  {% if action_html %}<div class="flex shrink-0 gap-2">{{ action_html|safe }}</div>{% endif %}
</div>
