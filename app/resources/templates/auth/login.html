<!DOCTYPE html>
<html lang="en" data-theme="rathdrum">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://fonts.bunny.net/css?family=instrument-sans:400,500,600,700">
  <link rel="stylesheet" href="/static/assets/app.css">
  <script type="module" src="/static/assets/app.js"></script>
  <title>Admin Login - Rathdrum CFR</title>
</head>
<body class="min-h-screen bg-base-200 flex items-center justify-center p-4">
  <div class="card w-full max-w-md bg-base-100 shadow-xl border border-base-300">
    <div class="card-body gap-4">
      <div class="rounded-box bg-primary px-4 py-3 text-primary-content -mx-2 -mt-2 mb-2 sm:mx-0 sm:mt-0">
        <h2 class="text-lg font-bold">Rathdrum CFR</h2>
        <p class="text-sm opacity-90">Admin sign in</p>
      </div>
      <form method="post" action="{{ url_for('auth.login.store') }}" class="space-y-1">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label class="form-control w-full">
          <span class="label-text font-medium">Email</span>
          <input name="email" type="email" class="input input-bordered w-full mt-1" required autocomplete="username">
        </label>
        <label class="form-control w-full">
          <span class="label-text font-medium">Password</span>
          <input name="password" type="password" class="input input-bordered w-full mt-1" required autocomplete="current-password">
        </label>
        <label class="label cursor-pointer justify-start gap-2 w-full py-2">
          <input type="checkbox" name="remember_me" class="checkbox checkbox-primary checkbox-sm">
          <span class="label-text">Remember me</span>
        </label>
        {% if errors and errors.email %}<p class="text-error text-sm">{{ errors.email }}</p>{% endif %}
        <button class="btn btn-primary w-full mt-2">Sign in</button>
      </form>
    </div>
  </div>
</body>
</html>
