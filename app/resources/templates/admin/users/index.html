{% extends "layouts/admin.html" %}
{% block title %}Users{% endblock %}
{% block content %}
<div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between mb-6">
  <div>
    <h1 class="text-2xl font-bold">Users</h1>
    <p class="text-sm text-base-content/70 mt-1">Manage accounts and report subscriptions.</p>
  </div>
  <a href="{{ url_for('admin.users.create') }}" class="btn btn-primary btn-sm">New user</a>
</div>
<div class="overflow-x-auto rounded-box border border-base-300 bg-base-100 shadow-sm">
  <table class="table">
    <thead>
      <tr class="bg-base-200/80">
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th class="text-right">Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for u in users %}
      <tr class="hover">
        <td class="font-medium">{{ u.name }}</td>
        <td>{{ u.email }}</td>
        <td><span class="badge badge-ghost badge-sm">{{ u.role }}</span></td>
        <td class="text-right"><a href="{{ url_for('admin.users.edit', user_id=u.id) }}" class="btn btn-ghost btn-xs">Edit</a></td>
      </tr>
      {% else %}
      <tr><td colspan="4" class="text-center text-base-content/60 py-8">No users yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
