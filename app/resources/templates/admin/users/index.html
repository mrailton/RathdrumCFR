{% extends "layouts/admin.html" %}
{% block title %}Users{% endblock %}
{% block content %}
<div class="flex justify-between mb-4">
  <h1 class="text-xl font-bold">Users</h1>
  <a href="{{ url_for('admin.users.create') }}" class="btn btn-primary btn-sm">New</a>
</div>
<ul class="bg-base-100 rounded-box shadow divide-y">
  {% for u in users %}
  <li class="p-3 flex justify-between items-center gap-2">
    <span>{{ u.name }} &lt;{{ u.email }}&gt;</span>
    <a href="{{ url_for('admin.users.edit', user_id=u.id) }}" class="btn btn-ghost btn-xs">Edit</a>
  </li>
  {% endfor %}
</ul>
{% endblock %}
