{% extends "layouts/admin.html" %}
{% block content %}
<form method="post" class="card bg-base-100 p-4 space-y-3 max-w-xl">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="date" name="date" class="input input-bordered w-full" value="{{ session.date if session else '' }}" required>
  <input name="topic" class="input input-bordered w-full" value="{{ session.topic if session else '' }}" required>
  <textarea name="notes" class="textarea textarea-bordered w-full">{{ session.notes if session else '' }}</textarea>
  <button class="btn btn-primary">Save</button>
</form>
{% endblock %}
