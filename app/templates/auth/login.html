<!DOCTYPE html>
<html lang="en" data-theme="corporate">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/assets/app.css">
  <script type="module" src="/static/assets/app.js"></script>
  <title>Admin Login</title>
</head>
<body class="min-h-screen bg-base-200 flex items-center justify-center p-4">
  <div class="card w-full max-w-sm bg-base-100 shadow-xl">
    <div class="card-body">
      <h2 class="card-title">Admin login</h2>
      <form method="post" action="{{ url_for('auth.login.store') }}" class="space-y-3">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label class="form-control w-full"><span class="label-text">Email</span><input name="email" type="email" class="input input-bordered w-full" required></label>
        <label class="form-control w-full"><span class="label-text">Password</span><input name="password" type="password" class="input input-bordered w-full" required></label>
        <label class="label cursor-pointer justify-start gap-2 w-full"><input type="checkbox" name="remember_me" class="checkbox checkbox-sm"><span class="label-text">Remember me</span></label>
        {% if errors and errors.email %}<p class="text-error text-sm">{{ errors.email }}</p>{% endif %}
        <button class="btn btn-primary w-full">Sign in</button>
      </form>
    </div>
  </div>
</body>
</html>
