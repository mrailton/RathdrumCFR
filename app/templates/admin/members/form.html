{% extends "layouts/admin.html" %}
{% block title %}{% if member %}Edit{% else %}New{% endif %} Member{% endblock %}
{% block content %}
<form method="post" action="{% if member %}{{ url_for('admin.members.update', member_id=member.id) }}{% else %}{{ url_for('admin.members.store') }}{% endif %}" class="card bg-base-100 shadow p-4 space-y-3 max-w-2xl">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input name="name" class="input input-bordered w-full" value="{{ member.name if member else '' }}" required>
  <select name="status" class="select select-bordered w-full">
    {% for s in statuses %}<option value="{{ s }}" {% if member and member.status == s %}selected{% endif %}>{{ s|title }}</option>{% endfor %}
  </select>
  <input name="title" class="input input-bordered w-full" value="{{ member.title if member else 'Responder' }}">
  <input name="phone" class="input input-bordered w-full" value="{{ member.phone if member else '' }}">
  <input name="email" class="input input-bordered w-full" value="{{ member.email if member else '' }}">
  <input name="cfr_certificate_expiry" type="date" class="input input-bordered w-full" value="{{ member.cfr_certificate_expiry if member and member.cfr_certificate_expiry else '' }}">
  <input name="garda_vetting_date" type="date" class="input input-bordered w-full" value="{{ member.garda_vetting_date if member and member.garda_vetting_date else '' }}">
  <button class="btn btn-primary w-full">Save</button>
</form>
{% endblock %}
