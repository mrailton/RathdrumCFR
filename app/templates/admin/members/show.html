{% extends "layouts/admin.html" %}
{% block title %}{{ member.name }}{% endblock %}
{% block content %}
<h1 class="text-xl font-bold">{{ member.name }}</h1>
<p class="opacity-80">{{ member.status }} · {{ member.phone or '' }}</p>
<a class="btn btn-sm mt-2" href="{{ url_for('admin.members.edit', member_id=member.id) }}">Edit</a>
<h2 class="font-semibold mt-4">Notes</h2>
<ul class="space-y-2 mt-2">{% for n in member.notes %}<li class="bg-base-100 p-2 rounded">{{ n.note }}</li>{% endfor %}</ul>
<form method="post" action="{{ url_for('admin.members.notes.store', member_id=member.id) }}" class="mt-3 flex gap-2">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input name="note" class="input input-bordered flex-1" required>
  <button class="btn btn-sm">Add</button>
</form>
{% endblock %}
